# CI: unit gate (which includes the packaging build tests).
#
# The license checks exist because pyproject.toml once declared MIT while
# LICENSE/README said Apache-2.0 (incorrect wheel metadata, downstream
# ambiguity). Two layers keep them from diverging again:
#   - tests/test_packaging_metadata.py — fast tomllib drift guards on the
#     pyproject config (SPDX expression matches the LICENSE file, no
#     PEP-639-superseded `License ::` classifiers).
#   - tests/test_packaging_build.py — builds the wheel AND the sdist and
#     verifies their contents (License-Expression metadata, LICENSE/NOTICE
#     bundled byte-identical in both artifacts).
# Both run as part of the gate step below.
name: ci

on:
  push:
  pull_request:

jobs:
  tests-and-packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (dev extra — the documented test toolchain incl. `build`)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit gate (the documented command; includes the packaging
          build tests: wheel+sdist license verification)
        run: python -m pytest tests/ -q -n 6
