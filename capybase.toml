# capybase.toml — runtime configuration for the capybase rebase agent.
#
# This file is a TEMPLATE / reference. The canonical place for it is the shared
# config dir, so a user repo need NOT carry any capybase config:
#
#   ~/.config/capybase/capybase.toml       (or $XDG_CONFIG_HOME/capybase/)
#   ~/.config/capybase/model_profile.json  (OUTPUT of `capybase calibrate`)
#   ~/.config/capybase/calibration.json    (written by scripts/fit_calibration.py)
#   ~/.config/capybase/providers/<name>.json (the canonical model-endpoint +
#       profile source for live runs; see `capybase provider list`)
#
# capybase reads config + calibration from that dir by default; override with
# `capybase --config <dir> ...`. A repo-local ./capybase.toml still takes
# precedence (per-repo overrides). Paths under .rebase-agent/ in the defaults
# below are PER-REPO RUNTIME ARTIFACTS (sessions, the RAG experience store) —
# they are intentionally repo-local, unlike the shared config dir.
# Packaging metadata lives in pyproject.toml; this is runtime.

# Config schema version. Absent = 1 (migrated at load with a notice);
# keys from the v1 layout are migrated or reported as ignored.
schema_version = 2

[model]
# OpenAI-compatible local endpoint (e.g. llama-server). NO endpoint is baked
# into this repo: set base_url / model / api_key for YOUR server in the shared
# config dir (~/.config/capybase/capybase.toml), a repo-local
# capybase.local.toml, or a provider config (~/.config/capybase/providers/
# <name>.json — the canonical mechanism the live-eval scripts use; see
# `capybase provider list` and src/capybase/provider_config.py).
# base_url = "http://your-llama-server:port/v1"
# api_key = "sk-local"
# The model id the server reports in /v1/models. capybase sends this
# verbatim in every completion request, so it must match what the server
# knows. Multi-model llama-servers typically serve models under ALIASES
# (chat / embed / default) rather than raw GGUF filenames.
# `capybase calibrate` keys the stored profile off this name, so keep it stable.
# model = "chat"
temperature = 0.2
# UPPER LIMIT on resolution iterations for a unit: each iteration draws ONE
# candidate and validates it; the first pass exits the loop and later
# iterations are feedback-conditioned (CEGIS repair). Default 1 = one draw,
# then CEGIS. Raise it for models where diversity beats repair — it sets the
# ceiling only, never an upfront spend.
samples = 1
# UPPER LIMIT on resolution iterations for COMPLEX units (when [routing] is
# enabled and the classifier calls the conflict complex): same semantics as
# `samples`, raised for multi-hunk files and large enclosing nodes where a
# repaired retry more often needs the extra attempt. 0 = disabled (complex
# units use `samples`). Sets the ceiling only — never an upfront spend.
samples_complex = 0
# Agreement fraction below which a self-consistency merge is flagged
# low-confidence (only consulted when enable_self_consistency is on — it is
# OFF by default; the consensus batch is the one place all N candidates are
# drawn before validation).
consensus_min_agreement = 0.4
# Two-pass prompting: extract intents first, then generate code conditioned on
# them. Runs at any sample count — intent extraction helps the single
# candidate too. PlanSearch (plan diversity) needs several candidates and
# currently engages only via the self-consistency batch (see the sampling
# note above: the standard path draws one validated candidate per iteration).
two_pass = false
# Raised temperature for the diverse multi-sampling pass (distinct from the low
# `temperature` used for focused retries).
sampling_temperature = 0.7
# Retained for the self-consistency batch path only (majority voting needs
# all N candidates in hand). The standard resolution path draws ONE candidate
# per validated iteration by design — there is nothing to parallelize.
parallel_samples = true
# Reasoning models (e.g. VibeThinker/DeepSeek-R1 style) emit long <think> chains
# before answering. If this is too low, the model runs out of tokens mid-thought
# (finish_reason=length) and never emits its JSON answer -> empty resolution.
max_tokens = 8192
# Send `response_format: {type: json_object}` on every completion. A few local
# servers reject this key; set false to fall back to the fenced-JSON parser.
# `capybase calibrate` detects support and stores it in the model profile below.
json_mode = true
request_timeout_seconds = 600
# Hard wall-clock cap on one generation attempt. A stalled stream aborts and
# becomes a retryable failure rather than hanging indefinitely.
generation_timeout_seconds = 180
# Transport-layer retry on transient LLM failures (connection reset, socket
# timeout, HTTP 5xx, the stalled-connection hard-deadline above). Sits BELOW the
# application-level CEGIS re-prompt loop (policy.max_retries_per_unit): a single
# generation gets up to retry_attempts transport tries, then CEGIS re-prompts
# with feedback. Does NOT retry HTTP 4xx (caller errors). 1 = no retries.
retry_attempts = 3
retry_base_delay_seconds = 1.0   # exponential backoff base; full jitter applied
retry_max_delay_seconds = 30.0   # backoff cap per sleep
# Model context window (input token budget). 0 = DISABLED: the resolve prompt is
# sent unbounded (the default, backward-compatible). When set (or auto-discovered
# by `capybase calibrate` from the server's /v1/models `context_length`), the
# prompt is capped to this window: the three conflict sides + the JSON contract
# are ALWAYS sent intact, and the augmentation sections (few-shot examples,
# cross-file deps, surrounding context) are trimmed — lowest-value first — to
# fit. A unit whose essential conflict content ALONE exceeds the window is
# never sent: the LLM call is skipped and the unit escalates (the
# llm_skipped_oversized journal event) — the model must never be asked to
# infer which part of a silently truncated prompt disappeared. Trimming is
# journaled per resolution on the candidate_generated event's prompt_trims
# field.
context_window = 0
# Tokens held back for the completion when sizing the input budget:
# available_input = context_window - completion_reserve.
completion_reserve = 1024

# --- Model calibration -----------------------------------------------------
# Run `capybase calibrate` once per model. It probes the endpoint and writes a
# tuned JSON profile (default output: .rebase-agent/memory/model_profile.json,
# or pass --profile) overriding the knobs above — AND the generation-mechanism
# choices (two_pass, plan_search, prompt_variants, diverse_sampling,
# enable_self_consistency, samples) — when the model name matches. Profiles
# are applied through PROVIDER CONFIGS at run time (never loaded from any
# ambient path); `capybase calibrate` redoes the measurement (slow: runs the
# corpus many times); `--dry-run` is a fast capabilities-only check. Delete
# the profile to revert to the values here. All mechanisms default off
# (samples = 1) until calibration turns one on.

[policy]
# Conflict modes (UU/AA/AU/UA) are deliberately NOT a config key: the set is
# fixed in code (capybase/policy.py SUPPORTED_CONFLICT_MODES) after a stale
# narrower pin here silently disabled add/add and modify/delete for
# config-file loads (s27-68/71). Only file kinds, retries, and gate switches
# are tunable below.
# Which file kinds are eligible for auto-resolution.
supported_file_kinds = ["text"]
max_retries_per_unit = 2
# Separate retry budget for verifier-critic disagreements. A critic-driven retry
# (the model produced a structurally-valid merge the LLM judge flagged for
# dropped intent) consumes THIS budget, NOT max_retries_per_unit — so a stubborn
# dropped-intent case can't starve the syntactic-CEGIS retries. 0 = mirror
# max_retries_per_unit (the same-size default — merge correctness is essential,
# latency is not, so the critic gets as many chances as the resolver).
max_critic_retries_per_unit = 0
# When the critic budget is exhausted, escalate only if the critic's verdict was
# high-confidence (verifier_confidence >= this threshold); otherwise accept-with-
# warning. 0.0 = never confidence-escalate (the conservative default).
critic_confidence_escalate_threshold = 0.8
# Hard wall-clock budget (seconds) for resolving ONE unit, across ALL retries
# (syntactic CEGIS, critic-driven, whole-file repair). A non-converging unit
# escalates once exceeded instead of looping — bounds total latency. 0 =
# disabled (retry-count budgets alone govern). Sits ABOVE the per-retry budgets.
max_wall_time_per_unit_seconds = 0.0
stage_only_validated_paths = true
# Number of context lines on each side of a conflict marker block.
context_lines = 15

[tests]
pre_continue = "pytest"
final = "pytest"
timeout_seconds = 300
required = true
# Test-continuity invariant: capture which tests PASS on the pre-rebase tree,
# then treat a baseline-passing test that FAILS post-merge as a behavioral
# regression the merge introduced — a high-signal counterexample the syntactic/
# intent validators can't catch. Runs the suite at rebase() start (best-effort;
# pytest is auto-run with -v so per-test node-IDs are parseable). OPT-OUT.
enable_test_continuity = true

[validation]
require_no_markers = true
require_exact_splice_scope = true
require_syntax_if_supported = true
reject_if_copies_one_side = true
# Rust crate-path errors (E0432 "unresolved import", E0433 "could not find
# type") are undecidable when the resolved file is checked standalone (without
# the full crate's dependency tree). Suppress them in the diagnostic delta so
# near-correct Rust merges aren't rejected for crate-path resolution failures.
# Empty (default) = strict (flag all errors). For Rust-heavy repos, set to
# ["E0432", "E0433"].
rust_suppress_codes = []
# Both-sides-represented (survey §5.1): flag a candidate that drops a side's
# additions entirely (a tweaked-but-one-sided merge the copy heuristic misses).
reject_if_drops_a_side = true
reject_if_model_needs_human = true
require_whole_file_validation = true
require_ast_preservation = true
# Intent-coverage floor (requires tree-sitter): minimum fraction of a side's
# ADDED structural units that must survive in the resolution. A deterministic,
# hard coverage guarantee — "never silently drop > (1-ratio) of a side's added
# units without a retry". Warning severity. 0.0 = disabled.
min_preservation_ratio = 0.5
# LSP / type-checker (Phase B): reject candidates introducing NEW type/compile
# errors. Requires pyright (pip install pyright) or rust-analyzer. Inert when
# the tool is absent.
enable_lsp_diagnostics = false
pyright_path = "pyright"
rust_analyzer_path = "rust-analyzer"
cargo_path = "cargo"
# Shadow tests (Phase B): run tests/test_<module>.py for a modified module
# before declaring success (warning severity, best-effort).
enable_shadow_tests = false
# Verifier-model critic (surveys §1/§5): an LLM judge that checks the
# resolution preserves BOTH sides' semantic intent — the one failure the
# syntactic validators are blind to (a merge that parses cleanly but drops a
# side's intent). Uses the same black-box API as the resolver; no model is
# trained or hosted. Its ACTIVATION lives in [features] llm_critic (default
# ON, opt-out) — this section carries only the severity. Gracefully skips
# (no hard-reject) if the call fails or the verdict is unparseable.
# Critic disagreement severity: "warning" (bias toward retry/escalate) or
# "error" (hard-reject a dropped-intent resolution).
verifier_severity = "warning"
# VeriGuard-style deterministic policy gate (survey §4): statically extract
# import/call facts from each candidate's resolved text (stdlib ast, Python
# only) and evaluate them against [[validation.policy_rules]]. The ONLY check
# that inspects WHAT a patch introduces — catches a clean-but-unsafe merge
# (e.g. adds subprocess to api/). Deterministic at runtime: no LLM, no
# execution. Inert when false OR no rules configured.
enable_policy_gate = false
# Each rule is [[validation.policy_rules]]. kind = "forbid_import" (matches when
# `pattern` is a prefix of any imported module) or "forbid_call" (matches when
# `pattern` is a prefix of any call target). severity "error" hard-blocks,
# "warning" flags. Uncomment and edit for your deployment, e.g.:
# [[validation.policy_rules]]
# name = "no_subprocess"
# kind = "forbid_import"
# pattern = "subprocess"
# severity = "error"
# reason = "subprocess is forbidden in auto-merged code"
#
# [[validation.policy_rules]]
# name = "no_eval"
# kind = "forbid_call"
# pattern = "eval"
# severity = "error"
# reason = "eval/exec are forbidden"
# LLM code-smell checks (survey §7): statically detect smells common in
# LLM-generated code (NaN comparison x == np.nan, pandas chain indexing df[a][b],
# uncontrolled randomness random.* with no seed) via stdlib ast. Deterministic
# pre-test quality filter; Python-only; graceful no-op otherwise. When false
# (default) the checker is inert.
enable_code_smell_checks = false
# Smell severity: "warning" (default — flag for review, don't hard-block) or
# "error" (treat a smelly patch as a hard failure).
code_smell_severity = "warning"

# Silent-resurrection detection: git's 3-way merge can resolve CLEANLY (no
# conflict) while resurrecting dead code the target branch deliberately deleted
# (the replayed branch predates the cleanup). After a clean rebase, capybase
# compares the result against content the target removed and flags any that came
# back. On by default; set enable_resurrection_detection = false to disable.
enable_resurrection_detection = true
# What to do on detection: "stop" (default — halt before completing, write a
# review bundle, route to the interactive fallback when a TTY is present; the
# backup branch keeps the repo recoverable) or "warn" (continue, but surface the
# findings in the summary + journal — useful in CI).
resurrection_policy = "stop"
# Minimum non-blank lines in a deleted block to count as a resurrection. Small
# reappearances are usually coincidental, not a revival of removed code.
resurrection_min_block_lines = 3
# Minimum line-coverage for a deleted block to count as "back" in the result
# (1.0 = whole block; 0.85 tolerates minor edits).
resurrection_min_similarity = 0.85

[journal]
enabled = true
store_prompts = true
store_raw_responses = true
store_snapshots = true
store_candidates = true

# Structural AST context (built in: the grammar-free abstract parser — no
# tree-sitter, no extra install). ACTIVATION lives in [features]
# structural_context; this section carries only the context-shaping knobs.
# When enabled the resolver sees the enclosing logical block
# (def/impl/struct) instead of a blind line window, and an AST-preservation
# validator guards against silent deletion of unchanged code. Silently
# degrades to the line-window behavior when the parse fails.
[structural]
languages = ["python", "rust"]
# If the lowest enclosing node is larger than this (lines), fall back to the
# line window — a whole 500-line module is not a useful "isolated block".
max_enclosing_node_lines = 60
cross_file_slice = true
slice_search_globs = ["**/*.py", "**/*.rs"]
# Use the enclosing AST node as primary context instead of the line window.
use_enclosing_as_primary = true
# Strip comment lines, docstrings, and blank runs from the context window.
canonicalize_context = true
# Refine conflict boundaries with `git merge-file --diff3` for the tightest
# possible marker span.
refine_with_diff3 = true
# xdiff backend for the merge-file alignment (survey §1.3). Histogram anchors
# on rare lines, producing tighter/stabler conflict regions than Myers on noisy
# code (conflict-size reduction in ~10% of conflicting merges). Selectable:
# "histogram" (default), "patience", "minimal", "myers".
diff_algorithm = "histogram"

# RAG experience replay: store labeled outcomes, retrieve similar past merges
# as dynamic few-shot. ACTIVATION lives in [features] rag; this section
# carries only the store/retriever knobs. The store accumulates from every
# capybase run; no manual labeling needed.
[memory]
store_path = ".rebase-agent/memory/experiences.jsonl"
retriever = "lexical"        # "lexical" (BM25, no deps) or "embedding" (semantic)
# The embedding model for /v1/embeddings (distinct from the completion model on
# a server serving both). Empty = reuse [model] model. `capybase calibrate`
# detects endpoint support and records it; when unsupported, RAG stays lexical.
# Multi-model llama-servers commonly serve the embedding slot under a distinct
# alias (e.g. "embed"), separate from the "chat" slot — and it may live on a
# DIFFERENT host than the completion model (provider configs carry both).
embeddings_model = "embed"
retriever_k = 3
min_examples_for_retrieval = 3

# Calibrated risk routing: replace the rules accept/escalate threshold with a
# learned one. Fit offline with scripts/fit_calibration.py once enough data
# accumulates; the fitted model is pure-Python inference (no sklearn at runtime).
[calibration]
enabled = false
model_path = ".rebase-agent/memory/calibration.json"
# OUTPUT path of `capybase calibrate` (what the CLI writes when no --profile
# path is given). This is NOT an ambient load path: profiles are applied only
# through provider configs at run time ("Profile wins" when the provider's
# profile model name matches [model] model; absent/mismatched = no-op).
model_profile_path = ".rebase-agent/memory/model_profile.json"
escalate_threshold = 0.7
# Consensus entropy above this → escalate (high-entropy splits mean no candidate
# is trustworthy even if one passed validators). 0=unanimous, 1=max split.
entropy_escalate_threshold = 0.8

# Difficulty-aware routing (survey §6.1) + balance-aware SBCR/LLM routing
# (survey §4.2). All opt-in; defaults keep behavior unchanged.
[routing]
enabled = false
# SBCR wins on balanced conflicts, loses to the LLM on imbalanced ones (§4.2).
# balance = min/max of the two sides' non-blank line counts (1.0=equal). Below
# this threshold an SBCR result is NOT short-circuited — the LLM runs instead.
# 0.15 = a conservative floor vs the research's ~0.2 crossover (the default).
# 0.0 = always accept SBCR when it resolves (disable the guard).
min_balance_for_sbcr_accept = 0.15

# --- Feature switches (one controlling key per feature) ----------------------
[features]
# Deterministic structural pre-resolution (survey §6.4 layer 1): BEFORE the
# LLM, attempt a model-free resolution (identical sides / one-sided change /
# disjoint line edits). Safe-by-construction + validated — a guess that fails
# validation falls through to the model (seeded with the rejected draft when
# [mechanisms] enable_near_miss_seeding is on), so it only cuts LLM load,
# never a worse merge. Default ON.
structural_resolution = true
# Search-based combination resolution (survey §4.1 SBCR): AFTER the structural
# resolver declines, search order-preserving interleavings of the two sides for
# the best combination (mean similarity to both parents). Covers the ~98.6% of
# combination resolutions that add no new lines. Default ON.
combination_search = true
# Structural AST context injection: populate units with their enclosing AST
# node so context/validators see logical blocks (knobs in [structural] above).
# Default OFF (opt-in).
structural_context = false
# RAG experience replay (few-shot retrieval from past accepted merges; store
# knobs in [memory] above). Single gate — no second flag needed. Default ON
# (sprint-21 golden path); retrieval stays inert until the store holds
# min_examples_for_retrieval examples.
rag = true
# Verifier-model critic: the LLM judge checking that a resolution preserves
# both sides' semantic intent (the failure mode syntactic validators are blind
# to). Default ON (opt-out).
llm_critic = true

# --- Mechanism toggles (stable, individually switchable) ---------------------
# Fine-grained switches for the deterministic resolution mechanisms and their
# research-tuned tuning. Dormant/planned seams + the jury canary live in
# [experimental] below.
[mechanisms]
# Deterministic import-union editor (Rust): AFTER the model produces a
# candidate, if change-accounting detects it copied one side and dropped an
# additive ``use`` import leaf, insert the missing leaf mechanically — no
# second model call. Tier-A primitive: deterministic, idempotent,
# transactional, conservative (AMBIGUOUS on doubt). Strict no-op when no
# import is missing or a safety precondition fails; cargo/rustc remains
# authoritative after the edit. Default ON.
enable_import_union = true
# Near-miss seeding (default ON — the paired targeted A/B won: 12/13
# slice cases identical-or-better, no attributable regression, seeded
# cases resolved in fewer LLM attempts): on the standard LLM resolution
# path, a rejected structural/SBCR draft seeds the first model attempt
# together with its validation failure — the seed is ephemeral (gone once
# the model has produced a usable candidate) and all-or-nothing under the
# token budget.
enable_near_miss_seeding = true
# Common-span factoring (S28-136, default OFF pending the oversized-case
# pilot): when the three conflict sides share large identical line runs,
# the prompt renders the sides as differing segments + ordered @An
# references and the model's resolution may reference them; capybase
# re-expands the shared spans verbatim and the full validation pipeline
# gates the reconstruction. Protocol violations latch the unit to
# unfactored retries. Flip to true after the pilot (the conversion of
# oversized escalations into resolutions is the headline metric).
enable_common_span_factoring = false
# Commit-intent context (S28-138 Fix B): show the replaying commit's
# non-conflicting hunks for the conflict's file — the commit's own diff is the
# cheapest evidence of what the edit was trying to accomplish (deterministic,
# zero model calls). Budget-trimmed between the structural anchor and the
# near-miss draft. Default ON after the 12-case A/B (verdict parity, block
# present in 3/12 cases' prompts, sim 0.99->1.00 on protobuf-0057).
enable_commit_intent_context = true
# Ordered splice selection (S28-139): for additive conflicts SBCR declined
# with fitness in the ambiguity band [splice_fitness_low, sbcr_floor), the
# model returns a tiny selection/order answer over the sides' blocks and
# capybase materializes verbatim (byte-identical copied code, tens of tokens
# per attempt). Runs as a POST-failure rescue: only after the LLM loop ended
# without an accepted candidate. Protocol violations latch the unit.
enable_ordered_splice = true
splice_fitness_low = 0.40         # below: composition implausible, generate
splice_max_chunks = 16            # more blocks = too fragmented to order
splice_max_glue_insertions = 4
splice_max_glue_lines = 3
# File-level drift rescue (S28-149): when the whole-file validation fails
# AFTER unit acceptances, the pristine stage sides are re-evaluated AS THE
# FILE against the same validation; a side that file-validates is taken over
# the drifted assembly (libuv-0056: current == oracle verbatim, final file
# still scored 0.85). Validator-authority acceptance, no LLM adjudication;
# partitioned after the whole-side repair rung. Default ON — it only fires
# on an already-failing validation.
enable_side_takeover_rescue = true
# Same-signature repetition stop (S28-140): identical whole-file hard-failure
# signatures across N consecutive repair rounds (with a model-drawn candidate
# in the window) mean the loop is thrashing — stop retrying and fall to the
# exhaustion endgame (wholesale floor, F1 arms, drift rescue) immediately
# (nlohmann-json-0038: three candidates rejected with the same "stray '@'").
enable_same_signature_stop = true
# SBCR tuning (arXiv:2605.16646 §4.1). Fitness is char-level Gestalt, mean-
# aggregated over both parents; the search is union-constrained (every candidate
# keeps all lines from both sides). These knobs expose the research-tuned params.
sbcr_floor = 0.6                  # min fitness to accept a candidate
sbcr_stagnation_limit = 10        # stop hill-climb after N consecutive non-improving evals
sbcr_max_time_seconds = 15.0      # wall-clock budget for hill-climb on large blocks
sbcr_max_iterations = 2000        # hard budget on fitness evaluations
# (Every other [mechanisms] toggle keeps its code default — the full list is
# the FutureConfig fields outside FUTURE_EXPERIMENTAL_FIELDS; see
# `capybase config explain --all`.)

# --- Experimental (dormant seams + the jury canary) ---------------------------
[experimental]
# --- Comment jury enforcement (Phase 4) -------------------------------------
# off (default) | shadow | enforce. In 'enforce' the jury acts on the four
# typed routes AFTER all deterministic gates + comment reconciliation + the
# executable-fingerprint check. The jury may NEVER override a deterministic
# failure. The full canary envelope (scope, required gates, failure routes,
# loop budgets, invariants, kill switch, stop conditions) is documented in
# docs/jury-canary-envelope.md.
#   KILL SWITCH: set jury_mode = "shadow" to return a live canary to no-merge-
#   effect observation (one action, no code change).
jury_mode = "off"
# Autonomous jury-driven code reopen. Separately gated: the shadow corpus has
# no positive code_reopen example, so this stays off for the Python canary.
# When off, a satisfied reopen becomes human_review (never accept / suppression).
enable_jury_code_reopen = false
# The bounded jury-driven comment CEGIS re-loop budget (enforce mode). After a
# jury comment_counterexample, the comment pass re-runs from the SAME frozen
# code + ledger with the counterexample as a seed failure. 0 disables (→ human).
jury_comment_cegis_budget = 2
# Eligibility allowlist (the Python canary envelope — the languages represented
# in the shadow corpus). Empty = inert.
jury_eligible_languages = ["python"]
# Replay + version-mismatch stamps (bump to invalidate the replay cache).
jury_config_version = "jury-cfg-v1"
jury_prompt_version = "jury-prompt-v1"


# ---------------------------------------------------------------------------
# First-use workflow (the safety-first commands)
# ---------------------------------------------------------------------------
#
#   capybase check                      # git + LLM + tools ready? (no mutation)
#   capybase rebase --dry-run <target>  # rehearse the WHOLE rebase in a throwaway
#                                       #   worktree; never moves your branch
#   capybase rebase <target>            # do the real rebase (own start→finish)
#   capybase status                     # read-only: latest session + backup branches
#
# Global flags (before the subcommand):
#   -v / --verbose    mirror debug logs to stderr while running
#   -q / --quiet      suppress console log output (the file log always runs)
#   --config <dir>    capybase config dir (default ~/.config/capybase)
#
# Every `rebase` creates a user-visible backup branch
# `capybase/backup/<branch>@<timestamp>` at the pre-rebase HEAD. On escalation
# (default) the rebase is aborted back to that HEAD and the backup remains so
# you can `git reset --hard <backup>` or `git branch -D <backup>` once satisfied.
# Cross-session logs rotate at ~/.local/share/capybase/logs/capybase.log.
